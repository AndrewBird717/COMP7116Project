apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-partition
spec:
  action: partition
  mode: all
  selector:
    pods:
      crdb-lab:
        - cockroachdb-0
  direction: both
  target:
    mode: all
    selector:
      pods:
        crdb-lab:
          - cockroachdb-1
          - cockroachdb-2
  duration: "60s"
