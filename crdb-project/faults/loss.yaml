apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-loss
spec:
  action: loss
  mode: all
  selector:
    pods:
      crdb-lab:
        - cockroachdb-0
  direction: both
  target:
    mode: all
    selector:
      pods:
        crdb-lab:
          - cockroachdb-1
          - cockroachdb-2
  loss:
    loss: "5"
    correlation: "0"
  duration: "60s"
